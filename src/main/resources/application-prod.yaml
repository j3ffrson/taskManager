spring:
  application:
    name: taskManager
  datasource:
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    jwt:
      private:
        key: ${JWT_PRIVATE_KEY}
      user:
        generator: ${JWT_USER_GENERATOR}
      expiration:
        time: ${JWT_TOKEN_EXPIRATION_HOURS}